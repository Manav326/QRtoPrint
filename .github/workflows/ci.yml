name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main, "feature/**"]

permissions:
  contents: read

env:
  SMARTPRINT_PUBLIC_BASE_URL: ${{ vars.SMARTPRINT_PUBLIC_BASE_URL }}

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install portal dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Typecheck native desktop frontend
        run: pnpm --filter @qrtoprint/desktop typecheck
      - name: Build native desktop frontend
        run: pnpm --filter @qrtoprint/desktop build
      - name: Validate portal Nginx proxy configuration
        run: docker run --rm --add-host api:127.0.0.1 -v "$GITHUB_WORKSPACE/apps/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
      - name: Validate production Compose configuration
        env:
          PUBLIC_BASE_URL: https://example.invalid
          IMAGE_NAMESPACE: ghcr.io/compose-validation
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: docker compose --env-file .env.example -f compose.yml config --quiet
      - name: Validate local development Compose configuration
        env:
          POSTGRES_DB: qrtoprint
          POSTGRES_USER: qrtoprint
          POSTGRES_PASSWORD: local-ci-validation-only
          AUTH_SIGNING_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh
          DOCUMENTS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          PUBLIC_BASE_URL: https://example.invalid
        run: docker compose -f compose.local.yml config --quiet

  api_dotnet:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build cloud API
        run: dotnet build src/SmartPrint.Api/SmartPrint.Api.csproj --configuration Release
      - name: Run API unit and model tests
        run: dotnet test tests/SmartPrint.Api.Tests/SmartPrint.Api.Tests.csproj --configuration Release

  agent_dotnet:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem scripts -Filter *.ps1 -Recurse
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Error "$($scriptFile.Name): $($parseError.Message) at line $($parseError.Extent.StartLineNumber)"
              }
              throw "PowerShell syntax validation failed for $($scriptFile.Name)."
            }
          }
      - name: Build Windows Print Agent
        run: dotnet build src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release
      - name: Run Windows Agent local queue tests
        run: dotnet test tests/SmartPrint.Agent.Tests/SmartPrint.Agent.Tests.csproj --configuration Release
      - name: Publish self-contained Windows Agent
        run: dotnet publish src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/agent
      - name: Smoke-test non-interactive Agent pairing status command
        shell: pwsh
        run: |
          $agent = Join-Path (Resolve-Path artifacts/agent) "SmartPrint.Agent.exe"
          $agentProcess = Start-Process -FilePath $agent -ArgumentList @("--check-pairing") -NoNewWindow -Wait -PassThru
          if ($agentProcess.ExitCode -ne 2) {
            throw "Expected an unpaired Windows Agent to exit with code 2, got $($agentProcess.ExitCode)."
          }
      - name: Add Agent setup scripts and guide
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/agent | Out-Null
          Copy-Item scripts/pair-agent.ps1, scripts/install-agent-service.ps1, scripts/uninstall-agent-service.ps1, scripts/verify-agent-local.ps1, src/SmartPrint.Agent/appsettings.example.json, src/SmartPrint.Agent/README.md artifacts/agent/
      - name: Upload Windows Agent package
        uses: actions/upload-artifact@v7
        with:
          name: qrtoprint-agent-win-x64
          path: artifacts/agent/
          if-no-files-found: error
          retention-days: 30

  windows_desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile the native Windows desktop host
        shell: pwsh
        run: |
          pnpm --filter @qrtoprint/desktop build
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint desktop frontend build failed." }
          cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint native desktop host compilation failed." }
          cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint native desktop host tests failed." }
      - name: Build native Windows desktop executable
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SMARTPRINT_PUBLIC_BASE_URL)) {
            throw "Configure the SMARTPRINT_PUBLIC_BASE_URL Actions variable before building the desktop application."
          }
          $env:VITE_API_BASE_URL = $env:SMARTPRINT_PUBLIC_BASE_URL
          pnpm --filter @qrtoprint/desktop exec tauri build --no-bundle --ci
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint native desktop build failed." }
          $nativeExe = "apps/desktop/src-tauri/target/release/smartprint-desktop.exe"
          if (-not (Test-Path -LiteralPath $nativeExe)) { throw "The SmartPrint native desktop executable was not produced." }
          New-Item -ItemType Directory -Force -Path artifacts/desktop | Out-Null
          Copy-Item -LiteralPath $nativeExe -Destination "artifacts/desktop/SmartPrint.Desktop.exe"
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release" -Filter "*.dll" -File |
            Copy-Item -Destination "artifacts/desktop" -Force
      - name: Bundle the Microsoft WebView2 Evergreen bootstrapper
        shell: pwsh
        run: |
          $bootstrapper = "artifacts/desktop/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper -MaximumRedirection 10
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "The downloaded WebView2 prerequisite did not pass Microsoft Authenticode verification."
          }
      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v7
        with:
          name: qrtoprint-desktop-win-x64
          path: artifacts/desktop/
          if-no-files-found: error
          retention-days: 30

  windows_installer:
    needs: [agent_dotnet, windows_desktop]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Download Windows Agent package
        uses: actions/download-artifact@v8
        with:
          name: qrtoprint-agent-win-x64
          path: artifacts/agent
      - name: Download Windows desktop package
        uses: actions/download-artifact@v8
        with:
          name: qrtoprint-desktop-win-x64
          path: artifacts/desktop
      - name: Build guided Windows setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path artifacts/agent-installer | Out-Null
          if ([string]::IsNullOrWhiteSpace($env:SMARTPRINT_PUBLIC_BASE_URL)) {
            throw "Configure the SMARTPRINT_PUBLIC_BASE_URL Actions variable before building the installer."
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DSmartPrintPublicUrl=$env:SMARTPRINT_PUBLIC_BASE_URL" /DSmartPrintVersion="ci" /DSmartPrintBuildId="${{ github.run_number }}" scripts/build-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
      - name: Verify Windows beta installer is unsigned
        shell: pwsh
        run: |
          $installer = "artifacts/agent-installer/SmartPrint-Windows-Setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "The Windows validation artifact must be intentionally unsigned for the beta distribution channel."
          }
      - name: Upload Windows installer validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: qrtoprint-windows-setup-validation
          path: artifacts/agent-installer/SmartPrint-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 30

  # Keep the original "dotnet" required-check name stable while the
  # independent API, Agent, desktop and installer jobs execute in parallel.
  dotnet:
    if: always()
    needs: [api_dotnet, agent_dotnet, windows_desktop, windows_installer]
    runs-on: ubuntu-latest
    steps:
      - name: Require every split Windows build to pass
        env:
          API_RESULT: ${{ needs.api_dotnet.result }}
          AGENT_RESULT: ${{ needs.agent_dotnet.result }}
          DESKTOP_RESULT: ${{ needs.windows_desktop.result }}
          INSTALLER_RESULT: ${{ needs.windows_installer.result }}
        run: |
          set -euo pipefail
          printf 'API: %s\nAgent: %s\nDesktop: %s\nInstaller: %s\n' \
            "$API_RESULT" "$AGENT_RESULT" "$DESKTOP_RESULT" "$INSTALLER_RESULT"
          test "$API_RESULT" = "success"
          test "$AGENT_RESULT" = "success"
          test "$DESKTOP_RESULT" = "success"
          test "$INSTALLER_RESULT" = "success"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qrtoprint
          POSTGRES_PASSWORD: qrtoprint_test_password
          POSTGRES_DB: qrtoprint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qrtoprint -d qrtoprint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTPRINT_TEST_POSTGRES: Host=localhost;Port=5432;Database=qrtoprint_test;Username=qrtoprint;Password=qrtoprint_test_password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Upgrade a historical PostgreSQL schema and verify operational defaults
        run: dotnet test tests/SmartPrint.Api.Tests/SmartPrint.Api.Tests.csproj --configuration Release

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Validate configured Android service origin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlsplit
          value = os.environ.get("SMARTPRINT_PUBLIC_BASE_URL", "").strip()
          parsed = urlsplit(value)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
              raise SystemExit("SMARTPRINT_PUBLIC_BASE_URL must be configured as the canonical public HTTPS origin.")
          print(f"Android service origin validated: {parsed.scheme}://{parsed.netloc}")
          PY
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android unit tests and build APK
        run: gradle --no-daemon -p apps/android -PsmartPrintServiceUrl="$SMARTPRINT_PUBLIC_BASE_URL" :app:testDebugUnitTest :app:assembleDebug
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            echo "Waking and unlocking the Android emulator before Espresso tests..."
            adb wait-for-device
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            adb shell locksettings set-disabled true || true
            adb shell settings put global stay_on_while_plugged_in 7
            adb shell settings put system screen_off_timeout 2147483647
            adb shell input keyevent KEYCODE_HOME
            sleep 2

            echo "Checking emulator power state..."
            adb shell dumpsys power | grep -E 'mWakefulness=Awake|Display Power: state=ON'
            echo "Current Android window focus:"
            adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true

            gradle --no-daemon -p apps/android -PsmartPrintServiceUrl="$SMARTPRINT_PUBLIC_BASE_URL" :app:connectedDebugAndroidTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-android-test-reports
          path: |
            apps/android/app/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/tests/testDebugUnitTest/
            apps/android/app/build/outputs/androidTest-results/connected/
            apps/android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  publish-containers:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [portal, dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare a CI-only Cloudflare Tunnel secret
        run: |
          mkdir -p .secrets/cloudflare
          printf 'ci-placeholder-token' > .secrets/cloudflare/tunnel-token
      - name: Validate Docker Compose configuration
        env:
          PUBLIC_BASE_URL: https://example.invalid
          IMAGE_NAMESPACE: ghcr.io/compose-validation
        run: docker compose --env-file .env.example -f compose.yml config --quiet
      - name: Validate local-only Docker Compose configuration
        env:
          POSTGRES_DB: qrtoprint
          POSTGRES_USER: qrtoprint
          POSTGRES_PASSWORD: local-ci-validation-only
          AUTH_SIGNING_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFh
          DOCUMENTS_ENCRYPTION_KEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          PUBLIC_BASE_URL: https://print.example.test
        run: docker compose -f compose.local.yml config --quiet
      - uses: docker/setup-buildx-action@v4
      - id: image_namespace
        name: Resolve lower-case GitHub Container Registry namespace
        shell: bash
        run: |
          namespace="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "value=$namespace" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image_namespace.outputs.value }}/qrtoprint-api:latest
            ${{ steps.image_namespace.outputs.value }}/qrtoprint-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=qrtoprint-api
          cache-to: type=gha,mode=max,scope=qrtoprint-api
      - name: Build and publish portal image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/portal/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image_namespace.outputs.value }}/qrtoprint-portal:latest
            ${{ steps.image_namespace.outputs.value }}/qrtoprint-portal:sha-${{ github.sha }}
          cache-from: type=gha,scope=qrtoprint-portal
          cache-to: type=gha,mode=max,scope=qrtoprint-portal

      - name: Smoke-test published containers and database migrations
        shell: bash
        run: |
          set -euo pipefail
          project="qrtoprint-smoke-${GITHUB_RUN_ID}"
          env_file=".env.ci"
          trap 'docker compose --project-name "$project" --env-file "$env_file" -f compose.yml logs --tail 100 || true; docker compose --project-name "$project" --env-file "$env_file" -f compose.yml down -v || true; rm -f "$env_file"' EXIT

          cat > "$env_file" <<EOF
          IMAGE_NAMESPACE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE_TAG=sha-${GITHUB_SHA}
          PUBLIC_BASE_URL=https://example.invalid
          POSTGRES_DB=qrtoprint
          POSTGRES_USER=qrtoprint
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          AUTH_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')
          DOCUMENTS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          EOF

          docker compose --project-name "$project" --env-file "$env_file" -f compose.yml up -d db api portal

          ready=false
          for attempt in $(seq 1 90); do
            if docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T api curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = "true"

          docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T portal wget -q -O /dev/null http://127.0.0.1/
          echo "API migrations, API readiness and portal container smoke checks passed."
