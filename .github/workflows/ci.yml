name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell deployment scripts
        shell: pwsh
        run: |
          $scriptFiles = Get-ChildItem scripts -Filter *.ps1 -Recurse
          foreach ($scriptFile in $scriptFiles) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($scriptFile.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($parseError in $parseErrors) {
                Write-Error "$($scriptFile.Name): $($parseError.Message) at line $($parseError.Extent.StartLineNumber)"
              }
              throw "PowerShell syntax validation failed for $($scriptFile.Name)."
            }
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build cloud API
        run: dotnet build src/SmartPrint.Api/SmartPrint.Api.csproj --configuration Release
      - name: Build Windows Print Agent
        run: dotnet build src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release
      - name: Run API unit and model tests
        run: dotnet test tests/SmartPrint.Api.Tests/SmartPrint.Api.Tests.csproj --configuration Release
      - name: Run Windows Agent local queue tests
        run: dotnet test tests/SmartPrint.Agent.Tests/SmartPrint.Agent.Tests.csproj --configuration Release
      - name: Publish self-contained Windows Agent
        run: dotnet publish src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/agent
      - name: Add Agent setup scripts and guide
        shell: pwsh
        run: |
          Copy-Item scripts/pair-agent.ps1, scripts/install-agent-service.ps1, scripts/uninstall-agent-service.ps1, src/SmartPrint.Agent/appsettings.example.json, src/SmartPrint.Agent/README.md artifacts/agent/
      - name: Upload Windows Agent package
        uses: actions/upload-artifact@v4
        with:
          name: qrtoprint-agent-win-x64
          path: artifacts/agent/
          if-no-files-found: error
          retention-days: 30

  publish-containers:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [portal, dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example -f compose.yml config --quiet
      - name: Validate Caddy HTTPS reverse proxy configuration
        run: |
          docker run --rm \
            -e PORTAL_DOMAIN=print.thinkwithsujeet.in \
            -e API_DOMAIN=api.thinkwithsujeet.in \
            -e ACME_EMAIL=ci@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/manav326/qrtoprint-api:latest
            ghcr.io/manav326/qrtoprint-api:sha-${{ github.sha }}
          cache-from: type=gha,scope=qrtoprint-api
          cache-to: type=gha,mode=max,scope=qrtoprint-api
      - name: Build and publish portal image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/portal/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/manav326/qrtoprint-portal:latest
            ghcr.io/manav326/qrtoprint-portal:sha-${{ github.sha }}
          cache-from: type=gha,scope=qrtoprint-portal
          cache-to: type=gha,mode=max,scope=qrtoprint-portal

      - name: Smoke-test published containers and database migrations
        shell: bash
        run: |
          set -euo pipefail
          project="qrtoprint-smoke-${GITHUB_RUN_ID}"
          env_file=".env.ci"
          trap 'docker compose --project-name "$project" --env-file "$env_file" -f compose.yml logs --tail 100 || true; docker compose --project-name "$project" --env-file "$env_file" -f compose.yml down -v || true; rm -f "$env_file"' EXIT

          cat > "$env_file" <<EOF
          IMAGE_TAG=sha-${GITHUB_SHA}
          PORTAL_DOMAIN=print.test
          API_DOMAIN=api.test
          ACME_EMAIL=ci@example.com
          POSTGRES_DB=qrtoprint
          POSTGRES_USER=qrtoprint
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          AUTH_SIGNING_KEY=$(openssl rand -base64 48 | tr -d '\n')
          DOCUMENTS_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')
          EOF

          docker compose --project-name "$project" --env-file "$env_file" -f compose.yml up -d db api portal

          ready=false
          for attempt in $(seq 1 90); do
            if docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T api curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = "true"

          docker compose --project-name "$project" --env-file "$env_file" -f compose.yml exec -T portal wget -q -O /dev/null http://127.0.0.1/
          echo "API migrations, API readiness and portal container smoke checks passed."
