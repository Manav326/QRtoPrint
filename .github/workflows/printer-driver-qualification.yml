name: Printer Driver Qualification

on:
  pull_request:
    paths:
      - "scripts/printer-qualification/**"
      - "tests/SmartPrint.Agent.Tests/WindowsPrinterDriverQualificationTests.cs"
      - ".github/workflows/printer-driver-qualification.yml"
      - "docs/PRINTER_DRIVER_QUALIFICATION.md"
  workflow_dispatch:
    inputs:
      driver_id:
        description: "Run manifest validation only, or qualify one explicitly approved driver"
        required: true
        type: choice
        default: manifest-only
        options:
          - manifest-only
          - hp-universal-pcl6-x64
          - canon-generic-plus-ufr-ii-x64
          - epson-universal-print-driver-x64
          - brother-universal-printer-driver-x64
          - pantum-p2503-x64
          - pantum-universal-printing-driver-x64

permissions:
  contents: read

concurrency:
  group: printer-driver-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Validate driver registry
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate manufacturer driver manifest (no downloads)
        shell: pwsh
        run: ./scripts/printer-qualification/Invoke-PrinterDriverQualification.ps1 -DriverId manifest-only

  qualify:
    name: Qualify selected Windows driver
    if: github.event_name == 'workflow_dispatch' && inputs.driver_id != 'manifest-only'
    needs: manifest
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build Windows Print Agent
        run: dotnet build src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release
      - name: Install approved signed driver and create isolated queue
        shell: pwsh
        env:
          DRIVER_ID: ${{ inputs.driver_id }}
        run: ./scripts/printer-qualification/Invoke-PrinterDriverQualification.ps1 -DriverId "$env:DRIVER_ID"
      - name: Render a QA document and capture driver capabilities
        env:
          SMARTPRINT_RUN_DRIVER_QUALIFICATION: "1"
        run: dotnet test tests/SmartPrint.Agent.Tests/SmartPrint.Agent.Tests.csproj --configuration Release --filter "FullyQualifiedName~WindowsPrinterDriverQualificationTests"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: printer-driver-qualification-${{ inputs.driver_id }}
          path: artifacts/printer-driver-qualification/
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary Windows printer queue and file port
        if: always()
        shell: pwsh
        run: |
          if ($env:SMARTPRINT_DRIVER_QUALIFICATION_QUEUE) {
            Remove-Printer -Name $env:SMARTPRINT_DRIVER_QUALIFICATION_QUEUE -ErrorAction SilentlyContinue
          }
          if ($env:SMARTPRINT_DRIVER_QUALIFICATION_PORT) {
            Remove-PrinterPort -Name $env:SMARTPRINT_DRIVER_QUALIFICATION_PORT -ErrorAction SilentlyContinue
          }
