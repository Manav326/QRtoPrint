name: Release SmartPrint
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable version tag to publish (for example v0.1.0)
        required: true
        type: string

concurrency:
  group: smartprint-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SMARTPRINT_PUBLIC_BASE_URL: ${{ vars.SMARTPRINT_PUBLIC_BASE_URL }}
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate-release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Require a stable semantic-version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Use a stable version tag such as v0.1.0. Pre-release tags are not published as latest."
            exit 1
          fi
      - name: Require a canonical HTTPS origin
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["SMARTPRINT_PUBLIC_BASE_URL"].strip()
          parsed = urlsplit(value)
          try:
              parsed_port = parsed.port
          except ValueError as error:
              raise SystemExit("SMARTPRINT_PUBLIC_BASE_URL contains an invalid port.") from error
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed_port == 0
              or parsed.username
              or parsed.password
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit(
                  "SMARTPRINT_PUBLIC_BASE_URL must be a canonical HTTPS origin, "
                  "without a path, query string, or fragment"
              )
          print(f"Release origin validated: {parsed.scheme}://{parsed.netloc}")
          PY

  windows-setup:
    needs: validate-release-config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install desktop and portal dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the native desktop frontend
        shell: pwsh
        run: |
          $env:VITE_API_BASE_URL = $env:SMARTPRINT_PUBLIC_BASE_URL
          pnpm --filter @qrtoprint/desktop build
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint desktop frontend build failed." }
      - name: Build native Windows desktop executable
        shell: pwsh
        run: |
          $env:VITE_API_BASE_URL = $env:SMARTPRINT_PUBLIC_BASE_URL
          pnpm --filter @qrtoprint/desktop exec tauri build --no-bundle --ci
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint native desktop build failed." }
          $nativeExe = "apps/desktop/src-tauri/target/release/smartprint-desktop.exe"
          if (-not (Test-Path -LiteralPath $nativeExe)) { throw "The SmartPrint native desktop executable was not produced." }
          New-Item -ItemType Directory -Force -Path artifacts/desktop | Out-Null
          Copy-Item -LiteralPath $nativeExe -Destination "artifacts/desktop/SmartPrint.Desktop.exe"
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release" -Filter "*.dll" -File |
            Copy-Item -Destination "artifacts/desktop" -Force
      - name: Bundle the Microsoft WebView2 Evergreen bootstrapper
        shell: pwsh
        run: |
          $bootstrapper = "artifacts/desktop/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper -MaximumRedirection 10
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "The downloaded WebView2 prerequisite did not pass Microsoft Authenticode verification."
          }
      - name: Publish self-contained Windows Agent
        shell: pwsh
        run: |
          dotnet publish src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/agent
          if ($LASTEXITCODE -ne 0) { throw "Windows Agent publish failed." }
          Copy-Item scripts/install-agent-service.ps1, scripts/uninstall-agent-service.ps1, scripts/verify-agent-local.ps1 artifacts/agent/
      - name: Build SmartPrint Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path artifacts/agent-installer | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSmartPrintPublicUrl=$env:SMARTPRINT_PUBLIC_BASE_URL" "/DSmartPrintVersion=$env:RELEASE_TAG" "/DSmartPrintBuildId=$env:GITHUB_RUN_NUMBER" scripts/build-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint Windows installer compilation failed." }
      - name: Confirm Windows installer is intentionally unsigned for the beta channel
        shell: pwsh
        run: |
          $installer = "artifacts/agent-installer/SmartPrint-Windows-Setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "The interim Windows beta package must not contain an unexpected or invalid Authenticode signature."
          }
          Write-Host "Verified: Windows beta installer is intentionally unsigned. SHA-256 will be published with the release."
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-windows-release
          path: artifacts/agent-installer/SmartPrint-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 5

  android-release:
    needs: validate-release-config
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 || vars.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD || vars.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS || vars.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD || vars.ANDROID_SIGNING_KEY_PASSWORD }}
    outputs:
      available: ${{ steps.check-signing.outputs.available }}
    steps:
      - id: check-signing
        name: Check Android release signing credentials
        shell: bash
        run: |
          set -euo pipefail
          names=(
            ANDROID_SIGNING_KEYSTORE_BASE64
            ANDROID_SIGNING_KEYSTORE_PASSWORD
            ANDROID_SIGNING_KEY_ALIAS
            ANDROID_SIGNING_KEY_PASSWORD
          )
          present=0
          missing=0
          for name in "${names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              ((present+=1))
            else
              ((missing+=1))
            fi
          done
          if (( missing > 0 )); then
            echo "::error::A signed Android APK is mandatory for a stable SmartPrint release."
            echo "::error::Missing Android signing values: check the repository Actions secrets or variables named in this job."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "All Android signing inputs are present; the release job will build and verify the signed APK."

      - uses: actions/checkout@v7
        if: steps.check-signing.outputs.available == 'true'
      - uses: actions/setup-java@v6
        if: steps.check-signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.check-signing.outputs.available == 'true'
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        if: steps.check-signing.outputs.available == 'true'
        with:
          packages: "platform-tools"
      - name: Install Android SDK build tools
        if: steps.check-signing.outputs.available == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare release keystore
        if: steps.check-signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/smartprint-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          echo "ANDROID_SIGNING_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build signed Android release APK
        if: steps.check-signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p apps/android \
            -PsmartPrintServiceUrl="$SMARTPRINT_PUBLIC_BASE_URL" \
            -PsmartPrintVersionCode="$GITHUB_RUN_NUMBER" \
            -PsmartPrintVersionName="$RELEASE_TAG" \
            :app:testDebugUnitTest :app:assembleRelease
          mkdir -p artifacts/android
          cp apps/android/app/build/outputs/apk/release/app-release.apk artifacts/android/SmartPrint-Android.apk
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$apksigner_path"
          verification_output="$("$apksigner_path" verify --verbose --print-certs artifacts/android/SmartPrint-Android.apk 2>&1)"
          printf '%s\n' "$verification_output"
          signer_count="$(awk -F': ' '/^Number of signers:/ { print $2; exit }' <<< "$verification_output")"
          certificate_fingerprint="$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*/\1/p' <<< "$verification_output" | head -n 1)"
          if [[ "$signer_count" != "1" || ! "$certificate_fingerprint" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Android APK signature verification did not report exactly one signing certificate fingerprint."
            exit 1
          fi
          echo "Verified Android release certificate SHA-256: $certificate_fingerprint"
      - name: Upload Android release APK
        if: steps.check-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-android-release
          path: artifacts/android/SmartPrint-Android.apk
          if-no-files-found: error
          retention-days: 5

  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - windows-setup
      - android-release
    env:
      ANDROID_RELEASE_AVAILABLE: ${{ needs.android-release.outputs.available }}
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: smartprint-windows-release
          path: artifacts
      - name: Download Android APK
        if: needs.android-release.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: smartprint-android-release
          path: artifacts
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          files=(SmartPrint-Windows-Setup.exe)
          if [[ "$ANDROID_RELEASE_AVAILABLE" == "true" ]]; then
            files+=(SmartPrint-Android.apk)
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload, verify and publish the versioned release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ANDROID_RELEASE_AVAILABLE: ${{ needs.android-release.outputs.available }}
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const includeAndroid = process.env.ANDROID_RELEASE_AVAILABLE === "true";

            if (!/^v\\d+\\.\\d+\\.\\d+$/.test(tag)) {
              core.setFailed("Refusing to publish a non-stable SmartPrint release tag: " + tag);
              return;
            }

            const binaries = ["SmartPrint-Windows-Setup.exe"];
            if (includeAndroid) binaries.push("SmartPrint-Android.apk");
            const expectedFiles = binaries.concat(["SHA256SUMS.txt"]);
            const artifactsDir = path.join(process.env.GITHUB_WORKSPACE, "artifacts");
            const checksumsText = fs.readFileSync(path.join(artifactsDir, "SHA256SUMS.txt"), "utf8");
            const checksums = new Map();
            for (const line of checksumsText.trim().split(/\\r?\\n/)) {
              const match = line.match(/^([a-f0-9]{64})\\s+\\*?(.+)$/i);
              if (!match) throw new Error("Invalid SHA256SUMS.txt entry: " + line);
              checksums.set(match[2], match[1].toLowerCase());
            }
            if (checksums.size !== binaries.length || binaries.some(name => !checksums.has(name))) {
              throw new Error("SHA256SUMS.txt does not match the packages enabled for this release.");
            }

            const versions = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100
            });
            let release = versions.find(item => item.tag_name === tag && item.draft);

            // The first publisher attempt created a draft with an untagged URL.
            // Replace only that unpublished draft; never delete or mutate a published release.
            if (release && release.html_url.includes("/releases/tag/untagged-")) {
              core.warning("Removing the unpublished untagged draft so the release can be recreated against the existing version tag.");
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              release = undefined;
            }

            if (versions.some(item => item.tag_name === tag && !item.draft)) {
              throw new Error("Release " + tag + " is already published. Published releases are immutable in this workflow.");
            }

            const tagRef = await github.rest.git.getRef({ owner, repo, ref: "tags/" + tag });
            let targetCommit = tagRef.data.object.sha;
            if (tagRef.data.object.type === "tag") {
              const annotated = await github.rest.git.getTag({ owner, repo, tag_sha: targetCommit });
              targetCommit = annotated.data.object.sha;
            }

            if (!release) {
              const notes = await github.rest.repos.generateReleaseNotes({
                owner, repo, tag_name: tag, target_commitish: targetCommit
              });
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: targetCommit,
                name: "SmartPrint " + tag,
                body: notes.data.body,
                draft: true,
                prerelease: false
              });
              release = created.data;
            }

            if (release.tag_name !== tag || !release.draft) {
              throw new Error("GitHub did not provide an unpublished draft for the requested tag.");
            }
            core.info("Using release draft " + release.id + " for " + tag + ".");

            const previousAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            const generatedNames = new Set(expectedFiles);
            for (const asset of previousAssets) {
              if (generatedNames.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }

            const contentTypes = {
              "SmartPrint-Windows-Setup.exe": "application/x-msdos-program",
              "SmartPrint-Android.apk": "application/vnd.android.package-archive",
              "SHA256SUMS.txt": "text/plain"
            };
            for (const filename of expectedFiles) {
              const filePath = path.join(artifactsDir, filename);
              const data = fs.readFileSync(filePath);
              if (data.length === 0) throw new Error("Refusing to upload an empty release asset: " + filename);
              const digest = crypto.createHash("sha256").update(data).digest("hex");
              if (filename !== "SHA256SUMS.txt" && digest !== checksums.get(filename)) {
                throw new Error("Local checksum validation failed for " + filename);
              }
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: filename,
                data,
                headers: {
                  "content-type": contentTypes[filename],
                  "content-length": String(data.length)
                }
              });
              core.info("Uploaded " + filename + " (" + data.length + " bytes).");
            }

            const uploadedAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100
            });
            const uploaded = new Map(uploadedAssets.map(asset => [asset.name, asset]));
            for (const filename of expectedFiles) {
              const asset = uploaded.get(filename);
              const localSize = fs.statSync(path.join(artifactsDir, filename)).size;
              if (!asset || asset.size !== localSize) {
                throw new Error("Uploaded release asset is missing or has a size mismatch: " + filename);
              }
              if (filename !== "SHA256SUMS.txt" && asset.digest && asset.digest !== "sha256:" + checksums.get(filename)) {
                throw new Error("GitHub asset digest does not match SHA256SUMS.txt: " + filename);
              }
            }
            if (uploaded.size !== expectedFiles.length) {
              throw new Error("Release contains an unexpected asset set: " + Array.from(uploaded.keys()).join(", "));
            }

            const published = await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, make_latest: "true"
            });
            if (published.data.draft || published.data.tag_name !== tag) {
              throw new Error("GitHub did not confirm publication of the verified " + tag + " release.");
            }
            core.notice("Published " + tag + " with the unsigned Windows beta installer and signed Android APK.");
            core.notice("Release URL: " + published.data.html_url);
