name: Release SmartPrint
on:
  push:
    tags:
      - "v*"

concurrency:
  group: smartprint-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SMARTPRINT_PUBLIC_BASE_URL: ${{ vars.SMARTPRINT_PUBLIC_BASE_URL || 'https://qr-test.paintpulp.com' }}

jobs:
  validate-release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Require a stable semantic-version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Use a stable version tag such as v0.1.0. Pre-release tags are not published as latest."
            exit 1
          fi
      - name: Require a canonical HTTPS origin
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["SMARTPRINT_PUBLIC_BASE_URL"].strip()
          parsed = urlsplit(value)
          try:
              parsed_port = parsed.port
          except ValueError as error:
              raise SystemExit("SMARTPRINT_PUBLIC_BASE_URL contains an invalid port.") from error
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed_port == 0
              or parsed.username
              or parsed.password
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit(
                  "SMARTPRINT_PUBLIC_BASE_URL must be a canonical HTTPS origin, "
                  "for example https://qr-test.paintpulp.com"
              )
          print(f"Release origin validated: {parsed.scheme}://{parsed.netloc}")
          PY

  windows-setup:
    needs: validate-release-config
    runs-on: windows-latest
    env:
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained Windows Agent
        shell: pwsh
        run: |
          dotnet publish src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/agent
          if ($LASTEXITCODE -ne 0) { throw "Windows Agent publish failed." }
          Copy-Item scripts/install-agent-service.ps1, scripts/uninstall-agent-service.ps1, scripts/verify-agent-local.ps1 artifacts/agent/
      - name: Build guided Windows setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path artifacts/agent-installer | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSmartPrintPublicUrl=$env:SMARTPRINT_PUBLIC_BASE_URL" "/DSmartPrintVersion=$env:GITHUB_REF_NAME" scripts/build-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint Windows installer compilation failed." }
      - name: Sign and verify Windows installer
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            throw "Configure WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD before publishing a public Windows installer."
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP "smartprint-code-signing.pfx"
          try {
            [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
            $windowsKits = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin"
            $signTool = Get-ChildItem $windowsKits -Filter signtool.exe -Recurse -ErrorAction Stop |
              Where-Object { $_.Directory.Name -eq "x64" } |
              Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
              Select-Object -First 1
            if (-not $signTool) { throw "Windows SDK SignTool was not found." }
            $installer = "artifacts/agent-installer/SmartPrint-Windows-Setup.exe"
            & $signTool.FullName sign /v /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer
            if ($LASTEXITCODE -ne 0) { throw "Windows installer signing failed." }
            & $signTool.FullName verify /pa /v $installer
            if ($LASTEXITCODE -ne 0) { throw "Windows installer signature verification failed." }
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-windows-release
          path: artifacts/agent-installer/SmartPrint-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 5

  android-release:
    needs: validate-release-config
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate Android release signing secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_SIGNING_KEYSTORE_BASE64 ANDROID_SIGNING_KEYSTORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name. Configure the SmartPrint Android release keystore before creating a release tag."
              exit 1
            fi
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare release keystore
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/smartprint-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          echo "ANDROID_SIGNING_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build signed Android release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p apps/android \
            -PsmartPrintServiceUrl="$SMARTPRINT_PUBLIC_BASE_URL" \
            -PsmartPrintVersionCode="$GITHUB_RUN_NUMBER" \
            -PsmartPrintVersionName="$GITHUB_REF_NAME" \
            :app:testDebugUnitTest :app:assembleRelease
          mkdir -p artifacts/android
          cp apps/android/app/build/outputs/apk/release/app-release.apk artifacts/android/SmartPrint-Android.apk
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$apksigner_path"
          "$apksigner_path" verify --verbose artifacts/android/SmartPrint-Android.apk
      - name: Upload Android release APK
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-android-release
          path: artifacts/android/SmartPrint-Android.apk
          if-no-files-found: error
          retention-days: 5

  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - windows-setup
      - android-release
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: smartprint-windows-release
          path: artifacts
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: smartprint-android-release
          path: artifacts
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum SmartPrint-Windows-Setup.exe SmartPrint-Android.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Prepare versioned release draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}/releases/tags/{quote(tag, safe='')}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          try:
              request = Request(api, headers=headers)
              with urlopen(request, timeout=30) as response:
                  release = json.loads(response.read())
          except HTTPError as error:
              if error.code == 404:
                  print(f"No existing release for {tag}; a new draft will be created.")
                  raise SystemExit(0)
              raise SystemExit(f"Could not safely inspect release {tag}: HTTP {error.code}")

          if not release.get("draft"):
              raise SystemExit(
                  f"Release {tag} is already published. Published versions are immutable "
                  "in this workflow; create a new version tag instead of replacing assets."
              )

          # Only remove the exact package assets generated by this workflow, and only from a draft.
          generated_assets = {
              "SmartPrint-Windows-Setup.exe",
              "SmartPrint-Android.apk",
              "SHA256SUMS.txt",
          }
          for asset in release.get("assets", []):
              if asset.get("name") not in generated_assets:
                  continue
              delete_url = (
                  f"https://api.github.com/repos/{repository}/releases/assets/{asset['id']}"
              )
              delete_request = Request(delete_url, headers=headers, method="DELETE")
              with urlopen(delete_request, timeout=30):
                  pass
          print(f"Existing draft {tag} prepared for a clean retry; published releases are untouched.")
          PY
      - name: Upload assets to an unpublished draft
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: SmartPrint ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            artifacts/SmartPrint-Windows-Setup.exe
            artifacts/SmartPrint-Android.apk
            artifacts/SHA256SUMS.txt
      - name: Verify uploaded assets and publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          artifact_dir = Path("artifacts")
          expected = {
              "SmartPrint-Windows-Setup.exe",
              "SmartPrint-Android.apk",
              "SHA256SUMS.txt",
          }
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          checksums = {}
          for line in (artifact_dir / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              checksums[filename.lstrip("*")] = digest
          if set(checksums) != expected - {"SHA256SUMS.txt"}:
              raise SystemExit("SHA256SUMS.txt does not contain exactly the Windows and Android packages.")
          for filename, expected_digest in checksums.items():
              actual_digest = hashlib.sha256((artifact_dir / filename).read_bytes()).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"Local checksum verification failed for {filename}.")

          release_url = (
              f"https://api.github.com/repos/{repository}/releases/tags/{quote(tag, safe='')}"
          )
          with urlopen(Request(release_url, headers=headers), timeout=30) as response:
              release = json.loads(response.read())
          if release.get("tag_name") != tag or not release.get("draft"):
              raise SystemExit("The release is missing, has the wrong tag, or is not an unpublished draft.")

          uploaded = {asset["name"]: asset for asset in release.get("assets", [])}
          if set(uploaded) != expected:
              raise SystemExit(
                  "Release draft has an unexpected asset set. "
                  f"Expected {sorted(expected)}, found {sorted(uploaded)}."
              )
          for filename in expected:
              local_size = (artifact_dir / filename).stat().st_size
              asset = uploaded[filename]
              if local_size <= 0 or asset.get("size") != local_size:
                  raise SystemExit(f"Uploaded asset size does not match the validated build: {filename}.")
              digest = asset.get("digest")
              if digest and filename in checksums and digest != f"sha256:{checksums[filename]}":
                  raise SystemExit(f"GitHub's asset digest does not match SHA256SUMS.txt: {filename}.")

          release_id = release["id"]
          publish_url = f"https://api.github.com/repos/{repository}/releases/{release_id}"
          payload = json.dumps({"draft": False, "make_latest": "true"}).encode("utf-8")
          publish_request = Request(
              publish_url,
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PATCH",
          )
          with urlopen(publish_request, timeout=30) as response:
              published = json.loads(response.read())
          if published.get("draft") or published.get("tag_name") != tag:
              raise SystemExit("GitHub did not confirm publication of the verified stable release.")
          print(f"Published {tag} with {len(expected)} verified assets. Older releases are not modified or deleted.")
          PY
