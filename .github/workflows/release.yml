name: Release SmartPrint
on:
  push:
    tags:
      - "v*"

concurrency:
  group: smartprint-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SMARTPRINT_PUBLIC_BASE_URL: ${{ vars.SMARTPRINT_PUBLIC_BASE_URL }}

jobs:
  validate-release-config:
    runs-on: ubuntu-latest
    steps:
      - name: Require a stable semantic-version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::Use a stable version tag such as v0.1.0. Pre-release tags are not published as latest."
            exit 1
          fi
      - name: Require a canonical HTTPS origin
        shell: bash
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          value = os.environ["SMARTPRINT_PUBLIC_BASE_URL"].strip()
          parsed = urlsplit(value)
          try:
              parsed_port = parsed.port
          except ValueError as error:
              raise SystemExit("SMARTPRINT_PUBLIC_BASE_URL contains an invalid port.") from error
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed_port == 0
              or parsed.username
              or parsed.password
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit(
                  "SMARTPRINT_PUBLIC_BASE_URL must be a canonical HTTPS origin, "
                  "for example https://qr-test.paintpulp.com"
              )
          print(f"Release origin validated: {parsed.scheme}://{parsed.netloc}")
          PY

  windows-setup:
    needs: validate-release-config
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install desktop and portal dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the native desktop frontend
        shell: pwsh
        run: |
          $env:VITE_API_BASE_URL = $env:SMARTPRINT_PUBLIC_BASE_URL
          pnpm --filter @qrtoprint/desktop build
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint desktop frontend build failed." }
      - name: Build native Windows desktop executable
        shell: pwsh
        run: |
          $env:VITE_API_BASE_URL = $env:SMARTPRINT_PUBLIC_BASE_URL
          pnpm --filter @qrtoprint/desktop exec tauri build --no-bundle --ci
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint native desktop build failed." }
          $nativeExe = "apps/desktop/src-tauri/target/release/smartprint-desktop.exe"
          if (-not (Test-Path -LiteralPath $nativeExe)) { throw "The SmartPrint native desktop executable was not produced." }
          New-Item -ItemType Directory -Force -Path artifacts/desktop | Out-Null
          Copy-Item -LiteralPath $nativeExe -Destination "artifacts/desktop/SmartPrint.Desktop.exe"
          Get-ChildItem -Path "apps/desktop/src-tauri/target/release" -Filter "*.dll" -File |
            Copy-Item -Destination "artifacts/desktop" -Force
      - name: Bundle the Microsoft WebView2 Evergreen bootstrapper
        shell: pwsh
        run: |
          $bootstrapper = "artifacts/desktop/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper -MaximumRedirection 10
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrapper
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or $signature.SignerCertificate.Subject -notmatch "Microsoft") {
            throw "The downloaded WebView2 prerequisite did not pass Microsoft Authenticode verification."
          }
      - name: Publish self-contained Windows Agent
        shell: pwsh
        run: |
          dotnet publish src/SmartPrint.Agent/SmartPrint.Agent.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/agent
          if ($LASTEXITCODE -ne 0) { throw "Windows Agent publish failed." }
          Copy-Item scripts/install-agent-service.ps1, scripts/uninstall-agent-service.ps1, scripts/verify-agent-local.ps1 artifacts/agent/
      - name: Build SmartPrint Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force -Path artifacts/agent-installer | Out-Null
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSmartPrintPublicUrl=$env:SMARTPRINT_PUBLIC_BASE_URL" "/DSmartPrintVersion=$env:GITHUB_REF_NAME" "/DSmartPrintBuildId=$env:GITHUB_RUN_NUMBER" scripts/build-windows-installer.iss
          if ($LASTEXITCODE -ne 0) { throw "SmartPrint Windows installer compilation failed." }
      - name: Confirm Windows installer is intentionally unsigned for the beta channel
        shell: pwsh
        run: |
          $installer = "artifacts/agent-installer/SmartPrint-Windows-Setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "The interim Windows beta package must not contain an unexpected or invalid Authenticode signature."
          }
          Write-Host "Verified: Windows beta installer is intentionally unsigned. SHA-256 will be published with the release."
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-windows-release
          path: artifacts/agent-installer/SmartPrint-Windows-Setup.exe
          if-no-files-found: error
          retention-days: 5

  android-release:
    needs: validate-release-config
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    outputs:
      available: ${{ steps.check-signing.outputs.available }}
    steps:
      - id: check-signing
        name: Check Android release signing credentials
        shell: bash
        run: |
          set -euo pipefail
          names=(
            ANDROID_SIGNING_KEYSTORE_BASE64
            ANDROID_SIGNING_KEYSTORE_PASSWORD
            ANDROID_SIGNING_KEY_ALIAS
            ANDROID_SIGNING_KEY_PASSWORD
          )
          present=0
          missing=0
          for name in "${names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              ((present+=1))
            else
              ((missing+=1))
            fi
          done
          if (( missing > 0 )); then
            echo "::error::A signed Android APK is mandatory for this release. Configure all four Android signing secrets before pushing a release tag."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.check-signing.outputs.available == 'true'
      - uses: actions/setup-java@v6
        if: steps.check-signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.check-signing.outputs.available == 'true'
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
        if: steps.check-signing.outputs.available == 'true'
        with:
          packages: "platform-tools"
      - name: Install Android SDK build tools
        if: steps.check-signing.outputs.available == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare release keystore
        if: steps.check-signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/smartprint-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          test -s "$key_file"
          echo "ANDROID_SIGNING_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build signed Android release APK
        if: steps.check-signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p apps/android \
            -PsmartPrintServiceUrl="$SMARTPRINT_PUBLIC_BASE_URL" \
            -PsmartPrintVersionCode="$GITHUB_RUN_NUMBER" \
            -PsmartPrintVersionName="$GITHUB_REF_NAME" \
            :app:testDebugUnitTest :app:assembleRelease
          mkdir -p artifacts/android
          cp apps/android/app/build/outputs/apk/release/app-release.apk artifacts/android/SmartPrint-Android.apk
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -n 1)"
          test -n "$apksigner_path"
          verification_output="$("$apksigner_path" verify --verbose --print-certs artifacts/android/SmartPrint-Android.apk 2>&1)"
          printf '%s\n' "$verification_output"
          if ! grep -Eiq 'Signer #1 certificate SHA-256 digest: [[:xdigit:]]{64}' <<< "$verification_output"; then
            echo "::error::Android APK signature verification did not report a signing certificate fingerprint."
            exit 1
          fi
      - name: Upload Android release APK
        if: steps.check-signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: smartprint-android-release
          path: artifacts/android/SmartPrint-Android.apk
          if-no-files-found: error
          retention-days: 5

  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - windows-setup
      - android-release
    env:
      ANDROID_RELEASE_AVAILABLE: ${{ needs.android-release.outputs.available }}
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: smartprint-windows-release
          path: artifacts
      - name: Download Android APK
        if: needs.android-release.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: smartprint-android-release
          path: artifacts
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          files=(SmartPrint-Windows-Setup.exe)
          if [[ "$ANDROID_RELEASE_AVAILABLE" == "true" ]]; then
            files+=(SmartPrint-Android.apk)
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Prepare versioned release draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repository}/releases/tags/{quote(tag, safe='')}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          try:
              request = Request(api, headers=headers)
              with urlopen(request, timeout=30) as response:
                  release = json.loads(response.read())
          except HTTPError as error:
              if error.code == 404:
                  print(f"No existing release for {tag}; a new draft will be created.")
                  raise SystemExit(0)
              raise SystemExit(f"Could not safely inspect release {tag}: HTTP {error.code}")

          if not release.get("draft"):
              raise SystemExit(
                  f"Release {tag} is already published. Published versions are immutable "
                  "in this workflow; create a new version tag instead of replacing assets."
              )

          # Only remove the exact package assets generated by this workflow, and only from a draft.
          generated_assets = {
              "SmartPrint-Windows-Setup.exe",
              "SmartPrint-Android.apk",
              "SHA256SUMS.txt",
          }
          for asset in release.get("assets", []):
              if asset.get("name") not in generated_assets:
                  continue
              delete_url = (
                  f"https://api.github.com/repos/{repository}/releases/assets/{asset['id']}"
              )
              delete_request = Request(delete_url, headers=headers, method="DELETE")
              with urlopen(delete_request, timeout=30):
                  pass
          print(f"Existing draft {tag} prepared for a clean retry; published releases are untouched.")
          PY
      - name: Upload assets to an unpublished draft
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          name: SmartPrint ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: artifacts/*
      - name: Verify uploaded assets and publish the stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          token = os.environ["GH_TOKEN"]
          artifact_dir = Path("artifacts")
          binaries = {"SmartPrint-Windows-Setup.exe"}
          if os.environ.get("ANDROID_RELEASE_AVAILABLE") == "true":
              binaries.add("SmartPrint-Android.apk")
          expected = binaries | {"SHA256SUMS.txt"}
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          checksums = {}
          for line in (artifact_dir / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines():
              digest, filename = line.split(maxsplit=1)
              checksums[filename.lstrip("*")] = digest
          if set(checksums) != binaries:
              raise SystemExit(
                  "SHA256SUMS.txt does not match the packages enabled for this release. "
                  f"Expected {sorted(binaries)}, found {sorted(checksums)}."
              )
          for filename, expected_digest in checksums.items():
              actual_digest = hashlib.sha256((artifact_dir / filename).read_bytes()).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"Local checksum verification failed for {filename}.")

          release_url = (
              f"https://api.github.com/repos/{repository}/releases/tags/{quote(tag, safe='')}"
          )
          with urlopen(Request(release_url, headers=headers), timeout=30) as response:
              release = json.loads(response.read())
          if release.get("tag_name") != tag or not release.get("draft"):
              raise SystemExit("The release is missing, has the wrong tag, or is not an unpublished draft.")

          uploaded = {asset["name"]: asset for asset in release.get("assets", [])}
          if set(uploaded) != expected:
              raise SystemExit(
                  "Release draft has an unexpected asset set. "
                  f"Expected {sorted(expected)}, found {sorted(uploaded)}."
              )
          for filename in expected:
              local_size = (artifact_dir / filename).stat().st_size
              asset = uploaded[filename]
              if local_size <= 0 or asset.get("size") != local_size:
                  raise SystemExit(f"Uploaded asset size does not match the validated build: {filename}.")
              digest = asset.get("digest")
              if digest and filename in checksums and digest != f"sha256:{checksums[filename]}":
                  raise SystemExit(f"GitHub's asset digest does not match SHA256SUMS.txt: {filename}.")

          release_id = release["id"]
          publish_url = f"https://api.github.com/repos/{repository}/releases/{release_id}"
          payload = json.dumps({"draft": False, "make_latest": "true"}).encode("utf-8")
          publish_request = Request(
              publish_url,
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="PATCH",
          )
          with urlopen(publish_request, timeout=30) as response:
              published = json.loads(response.read())
          if published.get("draft") or published.get("tag_name") != tag:
              raise SystemExit("GitHub did not confirm publication of the verified stable release.")
          if "SmartPrint-Android.apk" not in binaries:
              raise SystemExit("Refusing to publish a release without the required signed Android APK.")
          print(
              f"Published {tag} with the unsigned Windows beta installer and signed Android APK. "
              "Older releases are not modified or deleted."
          )
          PY
