<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme = "light";
        try {
          theme = localStorage.getItem("qrtoprint.theme") === "dark" ? "dark" : "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="theme-color" content="#7660df" />
    <meta name="description" content="SmartPrint connects local print shops and customers. Scan a shop QR code, send documents and manage print jobs in one seamless workflow." />
    <meta property="og:title" content="SmartPrint — From their phone to your printer" />
    <meta property="og:description" content="A simpler way for customers and local print shops to connect and print." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/smartprint-mark.svg" />
    <title>SmartPrint — From their phone to your printer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
