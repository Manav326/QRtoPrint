# Cloudflare sets CF-Connecting-IP at its edge. The API is reachable only through
# this private portal proxy, so replace client-supplied forwarding chains with the
# single edge-validated visitor address before forwarding to ASP.NET Core.
map $http_cf_connecting_ip $qrtoprint_client_ip {
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 22m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $qrtoprint_client_ip;
        proxy_set_header X-Forwarded-For $qrtoprint_client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The browser stays on this origin. The API follows GitHub's signed asset
    # redirects itself and streams the file back without exposing Location.
    location ^~ /downloads/ {
        proxy_pass http://api:8080/downloads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_redirect off;
        proxy_hide_header Location;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # All application scopes share one compiled SPA bundle. Keep the
    # Vite asset base rooted at / and return the SPA entry for route refreshes.
    location = /admin {
        try_files /index.html =404;
    }

    location ^~ /admin/ {
        try_files $uri /index.html;
    }

    location = /shop {
        try_files /index.html =404;
    }

    location ^~ /shop/ {
        try_files $uri /index.html;
    }

    location = /login {
        try_files /index.html =404;
    }

    location = /signup {
        try_files /index.html =404;
    }

    location ^~ /s/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
