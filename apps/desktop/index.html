<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <script>
      (() => {
        let theme = "light";
        try { theme = localStorage.getItem("qrtoprint.theme") === "dark" ? "dark" : "light"; } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const color = document.querySelector('meta[name="theme-color"]');
        if (color) color.content = theme === "dark" ? "#0c0f16" : "#f4f6fa";
      })();
    </script>
    <meta name="description" content="SmartPrint desktop workspace for print-shop operations." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>SmartPrint by QuantaEdge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
